<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blacklist</title>
    <style>
      body{
        margin: 0;
        font-family: "Tahoma";
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        min-height: 100vh;
        box-sizing: border-box;
      }
      .top-bar{
        padding: 10px;
      }
      .columns{
        display: grid;
        grid-template-columns: 1fr 1fr;
        width: 100%;
        box-sizing: border-box;
        padding: 0 20px;
      }
      .column{
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .column h2{
        font-size: 38px;
        letter-spacing: 4px;
        margin-top: 0;
        margin-bottom: 28px;
        text-transform: uppercase;
        text-align: center;
      }
      .column label{
        text-align: center;
        letter-spacing: 1px;
        align-content: center;
        font-size: 18px;
        font-weight: bold;
      }
      .column input{
        align-content: center;
        display: block;
        margin-top: 5px;
        width: 90%
      }
      .list-item{
        font-family: "Berlin Sans FB Demi";
        display: flex;
        justify-content: space-between;
        align-content: center;
        margin-top: 8px;
        width: 90%;
      }
    /*th{
        font-family: "Tahoma";
        font-size: 2vw;
        
    }*/
      .arrow-icon{
            height: 60px;
            width: auto;
      }




    </style>
</head>
<body>
  <div class="top-bar">
    <button id ="backBtn"><img src ="../images/arrow.jpg" class = "arrow-icon"></button>
  </div>
  
  <div class="columns">
    <div class="column">
      <h2>Sites</h2>
      <form>
        <label for="url">Enter an https:// URL:</label>
        <input
            type="url"
            name="url"
            id="url"
            placeholder="https://example.com"
            pattern="https://.*"
            size="30"
            required />
      </form>
      <div id="sitesList"></div>
    </div>
    <div class="column">
      <h2>Applications</h2>
      <form>
        <label for="app">Write the name of the process:</label>
        <input 
          type="text" 
          id="app"
          name="app"
          placeholder="example.exe"
          pattern =".*\.exe"
          size="30"
          required/>
      </form>
      <div id="appsList"></div>
    </div>
  </div>

  <script src = "blacklist-renderer.js"></script>
</body>
</html>
