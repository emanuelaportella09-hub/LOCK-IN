<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blacklist</title>
    <style>
      body{
        margin: 0;
        font-family: "Tahoma";
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        min-height: 100vh;
        box-sizing: border-box;
      }
      .top-bar{
        padding: 10px;
      }
      .column label.sub-label{
        display: block;
        font-size: 14px;
        font-weight: normal;
        margin-top: 4px;
      }
      .columns{
        display: grid;
        grid-template-columns: 1fr 1fr;
        width: 100%;
        box-sizing: border-box;
        padding: 0 20px;
      }
      .column{
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .column h2{
        font-size: 38px;
        letter-spacing: 4px;
        margin-top: 0;
        margin-bottom: 28px;
        text-transform: uppercase;
        text-align: center;
      }
      .column label{
        text-align: center;
        letter-spacing: 1px;
        align-content: center;
        font-size: 18px;
        font-weight: bold;
      }
      .column input{
        align-content: center;
        display: block;
        margin-top: 5px;
        width: 90%
      }
      .list-item{
        font-family: "Berlin Sans FB Demi";
        display: flex;
        justify-content: space-between;
        align-content: center;
        margin-top: 8px;
        width: 90%;
      }
      .btn{
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 8px;
      }
    /*th{
        font-family: "Tahoma";
        font-size: 2vw;
        
    }*/
      .arrow-icon{
            height: 60px;
            width: auto;
      }




    </style>
</head>
<body>
  <div class="top-bar">
    <button id ="backBtn"><img src ="../images/arrow.jpg" class = "arrow-icon"></button>
  </div>
  
  <div class="columns">
    <div class="column">
      <h2>Sites</h2>
      <form>
        <label for="url">Enter an URL:</label>
        <label class="sub-label">(press the enter key to enter a site)</label>
        <div class="btn">
        <input
            type="url"
            name="url"
            id="url"
            placeholder="https://example.com"
            pattern="https://.*"
            size="30"
            required />
        <button type="button" id="addSiteBtn">Add Site</button>
        </div>
        <label for="url">PLEASE DON'T ENTER WEIRD SITES LIKE MY GITHUB PAGE IT WON'T WORK PLEASE TRY SITE LIKE YOUTUBE ,INSTRAGRAM BECAUSE THE APP WAS MEANT FOR THOSE SITES DON'T BRING IT TO IT'S LIMITS AND WATCH MY VIDEO</label>
      </form>
      <div id="sitesList"></div>
    </div>
    <div class="column">
      <h2>Applications</h2>
      <form>
        <label for="app">Write the name of the process:</label>
        <label class="sub-label">(press the enter key to enter an app)</label>
        <div class="btn">
        <input 
          type="text" 
          id="app"
          name="app"
          placeholder="example.exe"
          pattern =".*\.exe"
          size="30"
          required/>
        <button type="button" id="addAppBtn">Add App</button>
        </div>
        <label for="app">IF UNSURE OF THE PROCESS GO TO TASK MANAGER AND SEE THE PROCESS NAME AND WATCH MY VIDEO IS ON MY README PAGE OF THE PROJECT</label>
      </form>
      <div id="appsList"></div>
    </div>
  </div>

  <script src = "blacklist-renderer.js"></script>
</body>
</html>
